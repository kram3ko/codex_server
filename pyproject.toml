[project]
name = "codex-server"
version = "0.1.0"
description = "Personal Codex server: FastAPI + Telegram bot + web chat"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "websockets>=16.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "redis>=7.4.0",
    "aiobotocore>=3.7.0",
    "aiogram>=3.28.2",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.2",
    "speechmatics-batch>=0.4.8",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "argon2-cffi>=25.1.0",
    "alembic>=1.18.4",
    "connectrpc>=0.10.0",
    "orjson>=3.11.9",
    "fastmcp>=3.3.1",
    "markdown-it-py>=4.2.0",
    "langid>=1.1.6",
    "uv>=0.11.14",
    "sentry-sdk[fastapi]>=2.60.0",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.2",
]

[dependency-groups]
# Тільки для генерації stubs з .proto і lint — у production image не їдуть.
proto = [
    "grpcio-tools>=1.80.0",
    "protoc-gen-connectrpc>=0.10.0",
]
lint = [
    "ruff>=0.15.12",
    "pyright>=1.1.409",
    "types-aiobotocore-s3>=3.7.0",
    "pre-commit>=4.0.1",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = false
# `uv sync` без флагів ставить тільки main deps — групи проти/lint/test
# тягнемо явно: `uv sync --group proto`, `uv sync --group lint`.
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["app/grpc_generated"]

[tool.ruff.lint]
# RET — flake8-return: ловить unreachable `return` після `return` (саме той
# `return False; return False` що проїхав у PR #13 непоміченим).
# RUF — Ruff-specific: useless-async, mutable-class-default, etc.
# PLE/PLW — pylint errors+warnings subset: useless-return, broad-except etc.
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "RUF", "PLE", "PLW"]
# Comments/docstrings/strings свідомо містять українські літери (`і`, `у`).
# RUF001/002/003 шумлять про "ambiguous Cyrillic" на ~400 рядків — глушимо.
ignore = ["RUF001", "RUF002", "RUF003"]

# Legitimate broad-except patterns (per CLAUDE.md §3 §7). Inline `# noqa`
# заборонено — все що залишилось після narrow'у живе тут з пояснення-чому.
[tool.ruff.lint.per-file-ignores]
# Декоратор-registration pattern: підмодулі `tools/*` мають side-effect
# реєструють @mcp.tool — імпорт через `*` потрібен.
"app/mcp/__init__.py" = ["F401", "F403"]
# RPC server-stream backstop: must always yield ErrorEvent, не можна давати
# unhandled exception завалити Connect-RPC stream silently.
"app/rpc/chat/stream.py" = ["BLE001"]
# User-supplied callback isolation: викликаємо on_thread_change від caller'а,
# що може кинути будь-що — isolate щоб не зламати reader-loop.
"app/services/codex/client.py" = ["BLE001"]
# Background read-loop: WebSocket consumer крутиться в asyncio.Task до close();
# будь-який unhandled exc → silent crash → всі pending future'и підвисають.
"app/services/codex/transport.py" = ["BLE001"]
# Future-from-setter resolver: setter може кинути будь-що, ловимо щоб
# вернути None замість CancelledError у getter'у.
"app/services/sessions/store.py" = ["BLE001", "B027"]
# asyncio done-callback: Python спеціально вимагає не пускати exc з callback,
# інакше Task warning + сторонні task'и не отримують сигнал.
"app/tg/polling.py" = ["BLE001"]
# TG turn backstop: aiogram polling-loop не повинен впасти від bug у одному
# turn-handler'і — інакше бот замовкає на всіх юзерів.
"app/tg/turn/runner.py" = ["BLE001"]
# markdown-it RendererHTML interface override: signature `(tokens, idx, options, env)`
# зафіксована библотекою; не можна префіксувати unused params `_*` бо pyright
# каже `reportIncompatibleMethodOverride`. Імена потрібно зберегти, тому ARG002
# тут — by design.
"app/tg/markdown.py" = ["ARG001", "ARG002"]
# Module-level `_configured` singleton flag — standard double-init guard
# pattern; `global` тут by design.
"app/log_config.py" = ["PLW0603"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyright]
include = ["app"]
exclude = ["app/grpc_generated", ".venv", "**/__pycache__"]
pythonVersion = "3.14"
reportMissingTypeStubs = false

