[project]
name = "codex-server"
version = "0.1.0"
description = "Personal Codex server: FastAPI + Telegram bot + web chat"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "aiobotocore>=3.6.0",
    "python-telegram-bot>=22.7",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
