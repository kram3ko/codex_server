[project]
name = "codex-server"
version = "0.1.0"
description = "Personal Codex server: FastAPI + Telegram bot + web chat"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "httpx>=0.28.1",
    "websockets>=16.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "redis>=7.4.0",
    "aiobotocore>=3.6.0",
    "aiogram>=3.27.0",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.2",
    "speechmatics-batch>=0.4.8",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "alembic>=1.18.4",
    "connectrpc>=0.10.0",
]

[dependency-groups]
# Тільки для генерації stubs з .proto і lint — у production image не їдуть.
proto = [
    "grpcio-tools>=1.80.0",
    "protoc-gen-connectrpc>=0.10.0",
]
lint = [
    "ruff>=0.15.12",
    "pyright>=1.1.409",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = false
# `uv sync` без флагів ставить тільки main deps — групи проти/lint/test
# тягнемо явно: `uv sync --group proto`, `uv sync --group lint`.
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["app/grpc_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyright]
include = ["app"]
exclude = ["app/grpc_generated", ".venv", "**/__pycache__"]
pythonVersion = "3.14"
reportMissingTypeStubs = false

