syntax = "proto3";

package codex.v1;

// Email + password JWT auth.
//
// Flow:
//   1) Client posts email+password до Login() → отримує access_token (JWT, HS256).
//   2) Усі наступні Connect-RPC дзвінки передають access_token у Authorization
//      header як `Bearer <token>`.
//   3) Refresh() бере поточний валідний Bearer і повертає свіжий JWT.

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  // JWT з claims: sub="codex-user", iat, exp.
  string access_token = 1;
  string token_type   = 2;  // "Bearer"
  int64  expires_in   = 3;  // seconds
}

message RefreshRequest {}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (LoginResponse);
}
