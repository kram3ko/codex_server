syntax = "proto3";

package codex.v1;

import "google/protobuf/timestamp.proto";
import "codex/v1/common.proto";

// AdminService — управління запрошеннями і користувачами. Всі методи
// доступні тільки `UserRole.ADMIN` (перевірка через `require_admin`).

enum UserRolePb {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER        = 1;
  USER_ROLE_ADMIN       = 2;
}

message Invite {
  int64 id = 1;
  string token = 2;                          // url-safe, single-use
  int64 created_by_user_id = 3;
  optional int64 used_by_user_id = 4;        // set після успішного Register
  google.protobuf.Timestamp expires_at = 5;
  optional google.protobuf.Timestamp used_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message AdminUser {
  int64 id = 1;
  optional string email = 2;
  optional int64 tg_user_id = 3;
  optional string display_name = 4;
  UserRolePb role = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateInviteRequest {
  // 1-30 днів; default 7 якщо unset/0.
  int32 ttl_days = 1;
}

message CreateInviteResponse {
  Invite invite = 1;
}

message ListInvitesRequest {
  bool include_used = 1;  // false (default) → тільки активні
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  int64 invite_id = 1;
}

// Прямий create без invite — admin створює аккаунт руками (для self або
// для друзів, без email-сесії).
message CreateUserRequest {
  string email         = 1;
  string password      = 2;
  string display_name  = 3;
  UserRolePb role      = 4;  // USER_ROLE_UNSPECIFIED → USER
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated AdminUser users = 1;
}

// SSH-ключ для codex-агента (admin sidecar). `name` = мітка, ім'я файлу
// `id_<name>` і Host-аліас у `~/.ssh/config` — клон через `git@<name>:org/repo`.
message SshKey {
  string name = 1;
  string host = 2;                          // реальний HostName (github.com)
  string user = 3;                          // ssh-юзер (порожньо → "git")
  google.protobuf.Timestamp created_at = 4;
}

message AddSshKeyRequest {
  string name = 1;
  string host = 2;
  string user = 3;
  string private_key = 4;                   // OpenSSH/PEM приватний ключ
}

message ListSshKeysRequest {}

message ListSshKeysResponse {
  repeated SshKey keys = 1;
}

message DeleteSshKeyRequest {
  string name = 1;
}

// API-токен для HTTPS git (github/gitlab/будь-який хост) — пишеться у
// `git-credentials`, агент клонує `https://<host>/org/repo` по токену.
message ApiToken {
  string name = 1;
  string host = 2;
  string user = 3;                          // username у credentials (порожньо → x-access-token)
  google.protobuf.Timestamp created_at = 4;
}

message AddApiTokenRequest {
  string name = 1;
  string host = 2;
  string user = 3;
  string token = 4;
}

message ListApiTokensRequest {}

message ListApiTokensResponse {
  repeated ApiToken tokens = 1;
}

message DeleteApiTokenRequest {
  string name = 1;
}

service AdminService {
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (Empty);
  rpc CreateUser(CreateUserRequest) returns (AdminUser);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc AddSshKey(AddSshKeyRequest) returns (SshKey);
  rpc ListSshKeys(ListSshKeysRequest) returns (ListSshKeysResponse);
  rpc DeleteSshKey(DeleteSshKeyRequest) returns (Empty);
  rpc AddApiToken(AddApiTokenRequest) returns (ApiToken);
  rpc ListApiTokens(ListApiTokensRequest) returns (ListApiTokensResponse);
  rpc DeleteApiToken(DeleteApiTokenRequest) returns (Empty);
}
