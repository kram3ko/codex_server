# App stack. Sidecar'и в docker/compose.codex.yml (project codex_codex).
# Спільна зовнішня мережа codex_net. Запуск — docker/up.sh з кореня.
services:
  codex-server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    container_name: codex-server
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://codex:codex@postgres:5432/codex
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: /minio
      CODEX_CLI_URL: ws://codex-cli:4500
      CODEX_CLI_GUEST_URL: ws://codex-cli-guest:4500
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_PRELOAD: ${GUNICORN_PRELOAD:-true}
    volumes:
      - ..:/home/codex/workspace
      - ../.codex/generated_images:/home/codex/.codex/generated_images:ro
    command: gunicorn app.main:app -c gunicorn.conf.py
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Vite dev server з HMR. Source live-mount, node_modules — named volume
  # (linux binaries, не конфліктує з host'овими). /api proxy → codex-server.
  # Production nginx + static `dist/` build — окремою компоновкою при cloud deploy.
  codex-web:
    image: node:24-alpine
    container_name: codex-web
    restart: unless-stopped
    working_dir: /web
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "8088:5173"
    volumes:
      - ../web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      codex-server:
        condition: service_healthy

  postgres:
    image: postgres:alpine
    container_name: codex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d codex"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: codex-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: codex-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: codex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/personal-codex || true &&
      exit 0
      "

networks:
  default:
    external: true
    name: codex_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
