# Isolated watchdog project (-p codex_watch) — separate from codex_codex so AI
# inside codex-cli can't kill the watchdog by recreating its own stack.
services:
  codex-watchdog:
    image: docker:cli
    container_name: codex-watchdog
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog/watch.sh:/watch.sh:ro

networks:
  default:
    external: true
    name: codex_net
