# Controller stack — Codex CLI sidecar'и. Окремий проект (-p codex_codex)
# щоб уникнути self-recreate paradox при `compose up -d --build` зсередини.
# Шарить codex_net з app stack.
services:
  codex-cli:
    build:
      context: ..
      dockerfile: docker/codex/Dockerfile
    container_name: codex-cli
    restart: unless-stopped
    labels:
      codex.watchdog: "true"
    user: "0:0"
    environment:
      MCP_CALLBACK_TOKEN: ${MCP_CALLBACK_TOKEN}
    volumes:
      - ../.codex:/home/codex/.codex:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/home/codex/workspace:rw
    tmpfs:
      - /codex-feedback:size=250m
    expose:
      - "4500"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4500/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  codex-cli-guest:
    build:
      context: ..
      dockerfile: docker/codex/Dockerfile
    container_name: codex-cli-guest
    restart: unless-stopped
    labels:
      codex.watchdog: "true"
    user: "0:0"
    environment:
      MCP_CALLBACK_TOKEN: ${MCP_CALLBACK_TOKEN}
    volumes:
      - ../.codex-guest:/home/codex/.codex:rw
      - ../.codex/generated_images:/home/codex/.codex/generated_images:rw
      - ../docker/codex/AGENTS-guest.md:/home/codex/workspace/AGENTS.md:ro
    tmpfs:
      - /codex-feedback:size=250m
    expose:
      - "4500"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4500/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Watchdog for label `codex.watchdog=true`; see watchdog/watch.sh.
  codex-watchdog:
    image: docker:cli
    container_name: codex-watchdog
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog/watch.sh:/watch.sh:ro

networks:
  default:
    external: true
    name: codex_net
