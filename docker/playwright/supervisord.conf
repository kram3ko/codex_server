[program:xvfb]
command=/bin/sh -c "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; exec /usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac +extension RANDR +extension GLX"
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -quiet
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:playwright-mcp]
; Isolated context + storage-state JSON: persistent login без user-data-dir
; lock-ів (refresh storage-state via `playwright codegen --save-storage=...`).
command=/bin/sh -c "[ -s /profile/storage-state.json ] || echo '{\"cookies\":[],\"origins\":[]}' > /profile/storage-state.json; exec /usr/bin/npx -y @playwright/mcp@0.0.75 --port 8931 --host 0.0.0.0 --browser chromium --isolated --storage-state /profile/storage-state.json --output-dir /home/codex/.codex/generated_images --viewport-size 1440,900 --allowed-hosts playwright-mcp:8931,localhost:8931,127.0.0.1:8931"
environment=DISPLAY=":99",HOME="/home/pwuser"
user=pwuser
priority=40
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/playwright-mcp.log
stderr_logfile=/var/log/supervisor/playwright-mcp.err
