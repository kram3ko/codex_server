name: codex_server

services:
  codex-cli:
    build:
      context: ..
      dockerfile: docker/codex/Dockerfile
    container_name: codex-cli
    restart: unless-stopped
    labels:
      codex.watchdog: "true"
    user: "0:0"
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      MCP_CALLBACK_TOKEN: ${MCP_CALLBACK_TOKEN}
      GH_TOKEN: ${GH_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Codex Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-codex@local}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-Codex Agent}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-codex@local}
      PLAYWRIGHT_MCP_URL: http://playwright-mcp:8931/mcp
      CODEX_WS_SECRET: ${CODEX_WS_SECRET_ADMIN}
      CODEX_WS_AUDIENCE: codex-cli-admin
    volumes:
      - ../.codex:/home/codex/.codex:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/home/codex/workspace:rw
      - ~/.ssh:/home/codex/.ssh:ro
    tmpfs:
      - /codex-feedback:size=250m
    expose:
      - "4500"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4500/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  codex-cli-guest:
    build:
      context: ..
      dockerfile: docker/codex/Dockerfile
    container_name: codex-cli-guest
    restart: unless-stopped
    labels:
      codex.watchdog: "true"
    user: "0:0"
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      MCP_CALLBACK_TOKEN: ${MCP_CALLBACK_TOKEN}
      CODEX_WS_SECRET: ${CODEX_WS_SECRET_GUEST}
      CODEX_WS_AUDIENCE: codex-cli-guest
    volumes:
      - ../.codex-guest:/home/codex/.codex:rw
      - ../.codex/generated_images:/home/codex/.codex/generated_images:rw
      - ../docker/codex/AGENTS-guest.md:/home/codex/workspace/AGENTS.md:ro
    tmpfs:
      - /codex-feedback:size=250m
    expose:
      - "4500"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4500/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  codex-server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    container_name: codex-server
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8000"
    env_file: ../.env
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      DATABASE_URL: postgresql+asyncpg://codex:codex@postgres:5432/codex
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: /minio
      CODEX_CLI_URL: ws://codex-cli:4500
      CODEX_CLI_GUEST_URL: ws://codex-cli-guest:4500
      CODEX_WS_SECRET_ADMIN: ${CODEX_WS_SECRET_ADMIN}
      CODEX_WS_SECRET_GUEST: ${CODEX_WS_SECRET_GUEST}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_PRELOAD: ${GUNICORN_PRELOAD:-true}
    volumes:
      - ..:/home/codex/workspace
      - ../.codex/generated_images:/home/codex/.codex/generated_images:ro
    command: gunicorn app.main:app -c gunicorn.conf.py
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      codex-cli:
        condition: service_healthy
      codex-cli-guest:
        condition: service_healthy

  codex-worker:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    container_name: codex-worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      TZ: ${TZ:-Europe/Kyiv}
      DATABASE_URL: postgresql+asyncpg://codex:codex@postgres:5432/codex
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: /minio
      CODEX_CLI_URL: ws://codex-cli:4500
      CODEX_CLI_GUEST_URL: ws://codex-cli-guest:4500
      CODEX_WS_SECRET_ADMIN: ${CODEX_WS_SECRET_ADMIN}
      CODEX_WS_SECRET_GUEST: ${CODEX_WS_SECRET_GUEST}
    volumes:
      - ..:/home/codex/workspace
      - ../.codex/generated_images:/home/codex/.codex/generated_images:ro
    command: taskiq worker app.worker:broker app.services.turns.tasks --workers 2 --ack-type when_executed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  codex-web:
    image: node:24-alpine
    container_name: codex-web
    restart: unless-stopped
    working_dir: /web
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "8088:5173"
    environment:
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - ../web:/web
      - ../protos:/protos:ro
      - web_node_modules:/web/node_modules
    depends_on:
      codex-server:
        condition: service_healthy

  postgres:
    image: postgres:alpine
    container_name: codex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d codex"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: codex-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "no"
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: codex-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: codex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/personal-codex || true &&
      exit 0
      "

  bugsink-db-init:
    image: postgres:alpine
    container_name: codex-bugsink-db-init
    environment:
      PGHOST: postgres
      PGUSER: codex
      PGDATABASE: codex
      PGPASSWORD: codex
    entrypoint:
      - sh
      - -eu
      - -c
      - |
        until pg_isready -q; do sleep 1; done
        psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='bugsink'" | grep -q . \
          || psql -c "CREATE USER bugsink WITH PASSWORD 'bugsink'"
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='bugsink'" | grep -q . \
          || psql -c "CREATE DATABASE bugsink OWNER bugsink"
    depends_on:
      postgres:
        condition: service_healthy

  bugsink:
    image: bugsink/bugsink:2.1.3
    container_name: codex-bugsink
    restart: unless-stopped
    ports:
      - "8089:8000"
    environment:
      SECRET_KEY: ${JWT_SECRET}
      PORT: "8000"
      DATABASE_URL: postgresql://bugsink:bugsink@postgres:5432/bugsink
      CREATE_SUPERUSER: "${ADMIN_EMAIL}:${ADMIN_PASSWORD}"
      BEHIND_HTTPS_PROXY: "False"
      BASE_URL: http://localhost:8089
    depends_on:
      bugsink-db-init:
        condition: service_completed_successfully

  bugsink-token-init:
    image: postgres:alpine
    container_name: codex-bugsink-token-init
    environment:
      PGHOST: postgres
      PGUSER: bugsink
      PGDATABASE: bugsink
      PGPASSWORD: bugsink
      TOKEN: ${BUGSINK_AUTH_TOKEN}
    entrypoint:
      - sh
      - -eu
      - -c
      - |
        [ -z "$$TOKEN" ] && exit 0
        until psql -tAc "SELECT 1 FROM bsmain_authtoken LIMIT 0" >/dev/null 2>&1; do sleep 1; done
        psql -c "INSERT INTO bsmain_authtoken (token, description, created_at)
                 VALUES ('$$TOKEN', 'codex-server', NOW())
                 ON CONFLICT (token) DO NOTHING"
    depends_on:
      bugsink:
        condition: service_started

  codex-watchdog:
    image: docker:cli
    container_name: codex-watchdog
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog/watch.sh:/watch.sh:ro

  playwright-mcp:
    build:
      context: ..
      dockerfile: docker/playwright/Dockerfile
    container_name: playwright-mcp
    restart: unless-stopped
    ipc: host
    shm_size: 1gb
    environment:
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - playwright_profile:/profile
      - ../.codex/generated_images:/home/codex/.codex/generated_images:rw
    expose:
      - "8931"
    ports:
      - "127.0.0.1:6080:6080"
    healthcheck:
      # MCP returns 400 on plain GET (expects POST з JSON-RPC). Будь-який HTTP
      # response = server alive; failure тільки на transport-level errors.
      test: ["CMD-SHELL", "curl -sS -o /dev/null -m 3 http://127.0.0.1:8931/mcp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Explicit volume names — project-prefix-independent. Якщо хтось запустить
# compose з іншим project (cwd folder name, custom -p), volume той самий →
# дані не "зникають" як артефакт docker compose naming.
volumes:
  postgres_data:
    name: codex_postgres_data
  minio_data:
    name: codex_minio_data
  web_node_modules:
    name: codex_web_node_modules
  playwright_profile:
    name: codex_playwright_profile
